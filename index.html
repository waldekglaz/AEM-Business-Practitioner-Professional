(function () {
  "use strict";

  const SKEY = "aem-bp-mock:v1:session";
  const HKEY = "aem-bp-mock:v1:history";
  const PKEY = "aem-bp-mock:v1:practice";
  const KEYS = "ABCDE";
  const WORDS = { 2: "two", 3: "three" };
  const SEC_IDS = Object.keys(SECTIONS).map(Number);

  const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
  const secOf = q => Number(q.o.split(".")[0]);
  const poolCount = s => QUESTIONS.filter(q => secOf(q) === s).length;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
  };

  const $bar = document.getElementById("bar");
  const $app = document.getElementById("app");

  let S = store.get(SKEY, null);
  let view = "home";
  let confirmOpen = false;
  let reviewFilter = "all";
  let tick = null;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }
  function md(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function fmt(ms) {
    ms = Math.max(0, ms);
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    return m + ":" + String(s).padStart(2, "0");
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function dateLabel(t) {
    try { return new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return new Date(t).toISOString().slice(0, 16).replace("T", " "); }
  }
  function save() { if (S) store.set(SKEY, S); else store.del(SKEY); }
  function passMark(n) { return n === EXAM.total ? EXAM.pass : Math.ceil(n * PASS_RATIO); }
  function isRight(it) {
    const a = byId[it.id].a;
    return it.picked.length === a.length && a.every(x => it.picked.includes(x));
  }
  function answeredCount() { return S.items.filter(i => i.picked.length).length; }
  function score() {
    const bySec = {};
    SEC_IDS.forEach(s => { bySec[s] = [0, 0]; });
    let correct = 0;
    S.items.forEach(it => {
      const s = secOf(byId[it.id]);
      bySec[s][1]++;
      if (isRight(it)) { bySec[s][0]++; correct++; }
    });
    return { correct, total: S.items.length, bySec };
  }
  function validSession(x) {
    return x && Array.isArray(x.items) && x.items.length > 0 &&
      x.items.every(i => byId[i.id] && Array.isArray(i.order) && i.order.length === byId[i.id].opts.length && Array.isArray(i.picked));
  }

  /* ---------- starting attempts ---------- */
  function makeItem(q) { return { id: q.id, order: shuffle(q.opts.map((_, i) => i)), picked: [], flagged: false, checked: false }; }

  function startExam() {
    const items = [];
    SEC_IDS.forEach(s => {
      shuffle(QUESTIONS.filter(q => secOf(q) === s)).slice(0, SECTIONS[s].draw).forEach(q => items.push(makeItem(q)));
    });
    const now = Date.now();
    S = { mode: "exam", items: shuffle(items), cur: 0, started: now, deadline: now + EXAM.minutes * 60000, done: null };
    confirmOpen = false;
    save(); startTick(); go("run");
  }

  function startPractice(secs, count) {
    const pool = shuffle(QUESTIONS.filter(q => secs.includes(secOf(q))));
    const n = count === "all" ? pool.length : Math.min(Number(count), pool.length);
    S = { mode: "practice", secs, items: pool.slice(0, n).map(makeItem), cur: 0, started: Date.now(), deadline: null, done: null };
    confirmOpen = false;
    save(); startTick(); go("run");
  }

  function finish(auto) {
    if (!S || S.done) return;
    S.done = Date.now();
    S.auto = !!auto;
    const r = score();
    const used = (S.deadline ? Math.min(S.done, S.deadline) : S.done) - S.started;
    const hist = store.get(HKEY, []);
    hist.unshift({ at: S.done, mode: S.mode, correct: r.correct, total: r.total, used });
    store.set(HKEY, hist.slice(0, 12));
    clearInterval(tick);
    confirmOpen = false;
    reviewFilter = "all";
    save();
    go("results");
  }

  function startTick() {
    clearInterval(tick);
    if (!S || S.done || S.mode !== "exam") return;
    tick = setInterval(() => {
      const left = S.deadline - Date.now();
      document.querySelectorAll("[data-timer]").forEach(t => {
        t.textContent = fmt(left);
        t.classList.toggle("warn", left < 10 * 60000);
      });
      if (left <= 0) finish(true);
    }, 1000);
  }

  /* ---------- navigation ---------- */
  function go(v) {
    view = v;
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function render(opts) {
    renderBar();
    if (view === "run" && S && !S.done) $app.innerHTML = runHTML();
    else if (view === "results" && S && S.done) $app.innerHTML = resultsHTML();
    else { view = "home"; $app.innerHTML = homeHTML(); }
    if (view === "run") afterRun(opts || {});
    if (view === "results") applyFilter();
  }

  function renderBar() {
    if (view === "run" && S && !S.done) {
      const n = S.items.length, done = answeredCount();
      $bar.innerHTML =
        "<div class=\"bar-in\">" +
          "<button class=\"brand\" data-act=\"home\" title=\"Back to the start page\">AD0-E138 <b>mock</b></button>" +
          "<div class=\"progress\" role=\"progressbar\" aria-label=\"Questions answered\" aria-valuemin=\"0\" aria-valuemax=\"" + n + "\" aria-valuenow=\"" + done + "\"><span style=\"width:" + (done / n * 100) + "%\"></span></div>" +
          (S.mode === "exam"
            ? "<span class=\"timer" + (S.deadline - Date.now() < 600000 ? " warn" : "") + "\" data-timer aria-label=\"Time left\">" + fmt(S.deadline - Date.now()) + "</span>"
            : "<span class=\"bar-note\">Practice</span>") +
        "</div>";
    } else {
      $bar.innerHTML =
        "<div class=\"bar-in\">" +
          "<button class=\"brand\" data-act=\"home\">AD0-E138 <b>mock</b></button>" +
          "<span class=\"bar-spacer\"></span>" +
          "<span class=\"bar-note hide-sm\">Unofficial practice exam</span>" +
        "</div>";
    }
  }

  /* ---------- home ---------- */
  function homeHTML() {
    const prefs = store.get(PKEY, { secs: SEC_IDS, count: "20" });
    const hist = store.get(HKEY, []);
    let banner = "";
    if (S && !S.done) {
      banner =
        "<section class=\"banner\" aria-label=\"Attempt in progress\">" +
          "<p><strong>" + (S.mode === "exam" ? "Exam" : "Practice") + " in progress.</strong> " +
          answeredCount() + " of " + S.items.length + " answered" +
          (S.mode === "exam" ? ", <span class=\"mono\" data-timer>" + fmt(S.deadline - Date.now()) + "</span> left" : "") + ".</p>" +
          "<div class=\"row\"><button class=\"btn btn-primary\" data-act=\"resume\">Resume</button>" +
          "<button class=\"btn\" data-act=\"discard\">Discard attempt</button></div>" +
        "</section>";
    } else if (S && S.done) {
      const r = score();
      banner =
        "<section class=\"banner\" aria-label=\"Last attempt\">" +
          "<p><strong>Last attempt:</strong> " + r.correct + " of " + r.total + " correct (" + Math.round(r.correct / r.total * 100) + "%).</p>" +
          "<div class=\"row\"><button class=\"btn\" data-act=\"results\">Review answers</button></div>" +
        "</section>";
    }

    const secPicks = SEC_IDS.map(s =>
      "<label class=\"check\" for=\"ps-" + s + "\">" +
        "<input type=\"checkbox\" id=\"ps-" + s + "\" value=\"" + s + "\"" + (prefs.secs.includes(s) ? " checked" : "") + ">" +
        "<span>" + s + ". " + esc(SECTIONS[s].name) + "</span>" +
        "<span class=\"muted mono\">" + poolCount(s) + "</span>" +
      "</label>").join("");
    const countOpts = [["10", "10 questions"], ["20", "20 questions"], ["40", "40 questions"], ["all", "Every question in those sections"]]
      .map(([v, l]) => "<option value=\"" + v + "\"" + (prefs.count === v ? " selected" : "") + ">" + l + "</option>").join("");

    const rows = SEC_IDS.map(s => {
      const objs = Object.keys(OBJECTIVES).filter(k => Number(k.split(".")[0]) === s)
        .map(k => "<li><span class=\"mono\">" + k + "</span>" + esc(OBJECTIVES[k]) + "</li>").join("");
      return "<tr>" +
        "<td><span class=\"sec-name\">" + s + ". " + esc(SECTIONS[s].name) + "</span><ul class=\"objs\">" + objs + "</ul></td>" +
        "<td class=\"num\">" + SECTIONS[s].weight + "%<span class=\"wbar\" aria-hidden=\"true\"><span style=\"width:" + (SECTIONS[s].weight / 28 * 100) + "%\"></span></span></td>" +
        "<td class=\"num\">" + SECTIONS[s].draw + "</td>" +
        "<td class=\"num\">" + poolCount(s) + "</td>" +
      "</tr>";
    }).join("");

    const histHTML = hist.length
      ? "<ul class=\"hist\">" + hist.map(h => {
          const pm = passMark(h.total), ok = h.correct >= pm;
          return "<li><span><strong>" + (h.mode === "exam" ? "Full exam" : "Practice") + "</strong> <span class=\"when\">" + esc(dateLabel(h.at)) +
            (h.mode === "exam" ? " · " + Math.max(1, Math.round(h.used / 60000)) + " min" : "") + "</span></span>" +
            "<span class=\"mono\">" + h.correct + "/" + h.total + "</span>" +
            "<span class=\"chip " + (ok ? "ok" : "bad") + "\">" + (ok ? "Pass" : "Below pass") + "</span></li>";
        }).join("") + "</ul>"
      : "<p class=\"empty\">Finished attempts appear here. They're saved in this browser only.</p>";

    return (
      "<section class=\"intro\">" +
        "<p class=\"eyebrow\">AD0-E138 · Adobe Experience Manager Business Practitioner Professional</p>" +
        "<h1>AEM Business Practitioner mock exam</h1>" +
        "<p class=\"lede\">Original practice questions mapped to the five sections and twenty objectives of the AD0-E138 exam. They cover AEM Sites, AEM Assets and AEM as a Cloud Service from a business practitioner's point of view.</p>" +
        "<dl class=\"facts\">" +
          "<div><dt>Questions</dt><dd>" + EXAM.total + "</dd></div>" +
          "<div><dt>Minutes</dt><dd>" + EXAM.minutes + "</dd></div>" +
          "<div><dt>To pass</dt><dd>" + EXAM.pass + "</dd></div>" +
          "<div><dt>In the bank</dt><dd>" + QUESTIONS.length + "</dd></div>" +
        "</dl>" +
      "</section>" +
      banner +
      "<div class=\"modes\">" +
        "<article class=\"mode mode-primary\">" +
          "<h2>Full exam</h2>" +
          "<p>" + EXAM.total + " questions drawn by the exam's section weights, a " + EXAM.minutes + "-minute timer, and a score report with explanations once you submit. You need " + EXAM.pass + " correct answers to pass.</p>" +
          "<button class=\"btn btn-primary\" data-act=\"start-exam\">Start full exam</button>" +
        "</article>" +
        "<article class=\"mode\">" +
          "<h2>Practice</h2>" +
          "<p>Choose sections and check each answer as you go, with the explanation and a link to Adobe's documentation. No timer.</p>" +
          "<fieldset class=\"picks\"><legend>Sections</legend>" + secPicks + "</fieldset>" +
          "<label class=\"field\" for=\"pcount\"><span>Length</span><select id=\"pcount\">" + countOpts + "</select></label>" +
          "<p class=\"err\" id=\"perr\" role=\"alert\" hidden>Choose at least one section.</p>" +
          "<button class=\"btn\" data-act=\"start-practice\">Start practice</button>" +
        "</article>" +
      "</div>" +
      "<section class=\"block\" aria-labelledby=\"bp-h\">" +
        "<div class=\"block-head\"><h2 id=\"bp-h\">Exam blueprint</h2>" +
        "<p>Sections, weights and objectives come from Adobe's AD0-E138 certification page. The real exam scores " + EXAM.total + " questions, passes at " + EXAM.pass + " and may include up to 10 extra unscored questions.</p></div>" +
        "<div class=\"table-wrap\"><table>" +
          "<thead><tr><th scope=\"col\">Section and objectives</th><th scope=\"col\">Weight</th><th scope=\"col\">Per exam</th><th scope=\"col\">In bank</th></tr></thead>" +
          "<tbody>" + rows + "</tbody>" +
        "</table></div>" +
      "</section>" +
      "<section class=\"block\" aria-labelledby=\"hist-h\">" +
        "<div class=\"block-head\"><h2 id=\"hist-h\">Your attempts</h2></div>" + histHTML +
      "</section>" +
      "<footer class=\"foot\">" +
        "<p>Unofficial study aid, not affiliated with or endorsed by Adobe. The questions are original and written against the published exam objectives; they aren't questions from the real exam.</p>" +
        "<p>AEM as a Cloud Service changes often, so check anything that looks off against the linked documentation. Official details: <a href=\"https://certification.adobe.com/certification/business-practitioner-professional-v2/539\" target=\"_blank\" rel=\"noopener\">AD0-E138 on Adobe Certification</a>.</p>" +
      "</footer>"
    );
  }

  /* ---------- exam console ---------- */
  function codeHTML(q) {
    if (!q.code) return "";
    return "<pre class=\"code\"><span class=\"code-lang\">" + esc(q.lang || "") + "</span><code>" + esc(q.code) + "</code></pre>";
  }
  function explainHTML(q) {
    return "<div class=\"explain\"><p class=\"label\">Why</p><p>" + md(q.ex) + "</p>" +
      "<p class=\"ref\"><a href=\"" + esc(q.ref[1]) + "\" target=\"_blank\" rel=\"noopener\">" + esc(q.ref[0]) + "</a> <span aria-hidden=\"true\">↗</span></p></div>";
  }
  function hintText(q) {
    return q.a.length > 1 ? "Choose " + (WORDS[q.a.length] || q.a.length) + " answers." : "Choose one answer.";
  }

  function runHTML() {
    const it = S.items[S.cur], q = byId[it.id], s = secOf(q), n = S.items.length;
    const multi = q.a.length > 1;
    const reveal = S.mode === "practice" && it.checked;
    const last = S.cur === n - 1;

    const opts = it.order.map((oi, k) => {
      const picked = it.picked.includes(oi), isAns = q.a.includes(oi);
      let cls = picked ? "picked" : "", mark = "";
      if (reveal) {
        cls = isAns ? "right" : picked ? "wrong" : "";
        mark = isAns ? (picked ? "Your answer · correct" : "Correct answer") : picked ? "Your answer" : "";
      }
      return "<label class=\"opt " + cls + (reveal ? " locked" : "") + "\" for=\"opt-" + k + "\">" +
        "<input type=\"" + (multi ? "checkbox" : "radio") + "\" name=\"opt\" id=\"opt-" + k + "\" value=\"" + oi + "\"" +
          (picked ? " checked" : "") + (reveal ? " disabled" : "") + ">" +
        "<span class=\"opt-key\" aria-hidden=\"true\">" + KEYS[k] + "</span>" +
        "<span class=\"opt-text\">" + md(q.opts[oi]) + "</span>" +
        (mark ? "<span class=\"opt-mark\">" + mark + "</span>" : "") +
      "</label>";
    }).join("");

    let feedback = "";
    if (reveal) {
      const ok = isRight(it);
      feedback = "<div class=\"feedback\" role=\"status\"><p class=\"verdict-line " + (ok ? "ok" : "bad") + "\">" +
        (ok ? "Correct." : "Not quite. The correct " + (multi ? "answers are" : "answer is") + " marked in green.") + "</p>" + explainHTML(q) + "</div>";
    }

    const enough = it.picked.length === q.a.length;
    let primary;
    if (S.mode === "practice" && !it.checked) {
      primary = "<button class=\"btn btn-primary\" data-act=\"check\"" + (enough ? "" : " disabled") + ">Check answer</button>" +
        "<button class=\"btn\" data-act=\"" + (last ? "submit" : "next") + "\">" + (last ? "Finish" : "Skip") + "</button>";
    } else {
      primary = "<button class=\"btn btn-primary\" data-act=\"" + (last ? "submit" : "next") + "\">" +
        (last ? (S.mode === "exam" ? "Review and submit" : "Finish practice") : "Next question") + "</button>";
    }

    const cells = S.items.map((x, i) => {
      const c = ["cell"];
      if (S.mode === "practice" && x.checked) c.push(isRight(x) ? "right" : "wrong");
      else if (x.picked.length) c.push("answered");
      if (x.flagged) c.push("flagged");
      if (i === S.cur) c.push("current");
      const state = (x.picked.length ? "answered" : "unanswered") + (x.flagged ? ", flagged" : "");
      return "<li><button class=\"" + c.join(" ") + "\" data-act=\"goto\" data-i=\"" + i + "\" aria-label=\"Question " + (i + 1) + ", " + state + "\"" +
        (i === S.cur ? " aria-current=\"step\"" : "") + ">" + (i + 1) + "</button></li>";
    }).join("");

    const legend = S.mode === "practice"
      ? "<li><span class=\"sw answered\"></span>Answered</li><li><span class=\"sw right\"></span>Correct</li><li><span class=\"sw wrong\"></span>Wrong</li><li><span class=\"sw flagged\"></span>Flagged</li>"
      : "<li><span class=\"sw answered\"></span>Answered</li><li><span class=\"sw\"></span>Not answered</li><li><span class=\"sw flagged\"></span>Flagged</li>";

    let dialog = "";
    if (confirmOpen) {
      const un = n - answeredCount(), fl = S.items.filter(x => x.flagged).length;
      const exam = S.mode === "exam";
      dialog =
        "<div class=\"overlay\" data-act=\"cancel-submit\">" +
          "<div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-h\" data-stop>" +
            "<h2 id=\"dlg-h\">" + (exam ? "Submit your exam?" : "Finish this practice set?") + "</h2>" +
            "<p>You've answered " + answeredCount() + " of " + n + " questions." +
              (un ? " " + plural(un, "question is", "questions are") + " unanswered and will count as wrong." : "") +
              (fl ? " " + plural(fl, "question is", "questions are") + " flagged for review." : "") +
              (exam ? " You can't change answers after submitting." : "") + "</p>" +
            "<div class=\"row\"><button class=\"btn\" data-act=\"cancel-submit\" id=\"dlg-cancel\">Keep working</button>" +
            "<button class=\"btn btn-primary\" data-act=\"confirm-submit\">" + (exam ? "Submit exam" : "See results") + "</button></div>" +
          "</div>" +
        "</div>";
    }

    return (
      "<div class=\"run\">" +
        "<section class=\"qpane\" aria-labelledby=\"qtitle\">" +
          "<p class=\"eyebrow\"><span class=\"mono\">Question " + (S.cur + 1) + " of " + n + "</span> · " + q.o + " " + esc(OBJECTIVES[q.o]) + "</p>" +
          "<h1 class=\"qtext\" id=\"qtitle\" tabindex=\"-1\">" + md(q.q) + "</h1>" +
          codeHTML(q) +
          "<p class=\"hint" + (multi ? " multi" : "") + "\">" + hintText(q) + "</p>" +
          "<fieldset class=\"opts " + (multi ? "multi-set" : "single-set") + "\"><legend class=\"sr\">Answers</legend>" + opts + "</fieldset>" +
          feedback +
          "<div class=\"qactions\">" +
            "<div class=\"row\">" +
              "<button class=\"btn\" data-act=\"prev\"" + (S.cur === 0 ? " disabled" : "") + ">Previous</button>" +
              "<button class=\"btn btn-flag\" data-act=\"flag\" aria-pressed=\"" + (it.flagged ? "true" : "false") + "\">" + (it.flagged ? "Flagged" : "Flag for review") + "</button>" +
            "</div>" +
            "<div class=\"row\">" + primary + "</div>" +
          "</div>" +
          "<p class=\"keys\">Keyboard: A–" + KEYS[q.opts.length - 1] + " choose · N next · P previous · F flag</p>" +
        "</section>" +
        "<aside class=\"rail\" aria-label=\"Question navigator\">" +
          "<div class=\"rail-head\"><h2>Questions</h2><span class=\"mono muted\">" + answeredCount() + "/" + n + "</span></div>" +
          "<ol class=\"grid\">" + cells + "</ol>" +
          "<ul class=\"legend\">" + legend + "</ul>" +
          "<button class=\"btn " + (S.mode === "exam" ? "btn-primary" : "") + "\" data-act=\"submit\">" + (S.mode === "exam" ? "Submit exam" : "Finish practice") + "</button>" +
        "</aside>" +
      "</div>" + dialog
    );
  }

  function afterRun(o) {
    if (confirmOpen) { const b = document.getElementById("dlg-cancel"); if (b) b.focus(); return; }
    if (o.focusOpt != null) {
      const el = $app.querySelector("input[name=\"opt\"][value=\"" + o.focusOpt + "\"]");
      if (el) el.focus({ preventScroll: true });
    } else if (o.moved) {
      const h = document.getElementById("qtitle");
      if (h) h.focus({ preventScroll: true });
      const top = $app.getBoundingClientRect().top + window.scrollY - 80;
      if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: reduceMotion ? "auto" : "smooth" });
    }
  }

  function pick(oi, fromKey) {
    const it = S.items[S.cur], q = byId[it.id];
    if (S.mode === "practice" && it.checked) return;
    const need = q.a.length;
    if (need === 1) {
      it.picked = [oi];
    } else if (it.picked.includes(oi)) {
      it.picked = it.picked.filter(x => x !== oi);
    } else {
      it.picked.push(oi);
      if (it.picked.length > need) it.picked.shift();
    }
    save();
    render({ focusOpt: fromKey ? null : oi });
  }

  function move(d) {
    const i = Math.min(S.items.length - 1, Math.max(0, S.cur + d));
    if (i === S.cur) return;
    S.cur = i; save(); render({ moved: true });
  }

  /* ---------- results ---------- */
  function resultsHTML() {
    const r = score(), n = r.total, pm = passMark(n), passed = r.correct >= pm;
    const exam = S.mode === "exam";
    const used = (S.deadline ? Math.min(S.done, S.deadline) : S.done) - S.started;
    const diff = Math.abs(r.correct - pm);
    const verdict = passed
      ? (r.correct === pm ? "Pass, exactly at the pass mark of " + pm + "." : "Pass. " + plural(diff, "answer", "answers") + " above the pass mark of " + pm + ".")
      : "Below the pass mark. " + plural(diff, "more correct answer", "more correct answers") + " needed to reach " + pm + ".";

    const cells = Array.from({ length: n }, (_, k) => "<i class=\"" + (k < r.correct ? "on" : "") + "\"></i>").join("");
    const gap = n > 60 ? "1px" : "3px";

    const secRows = SEC_IDS.filter(s => r.bySec[s][1] > 0).map(s => {
      const [c, t] = r.bySec[s], pct = Math.round(c / t * 100);
      return "<div class=\"sec-row\">" +
        "<span class=\"label\">" + s + ". " + esc(SECTIONS[s].name) + "<small>" + SECTIONS[s].weight + "% of the exam</small></span>" +
        "<div class=\"bar2\" role=\"img\" aria-label=\"" + pct + "% correct\"><span class=\"" + (c / t >= PASS_RATIO ? "ok" : "") + "\" style=\"width:" + pct + "%\"></span><i class=\"tick\" style=\"left:" + (PASS_RATIO * 100) + "%\"></i></div>" +
        "<span class=\"val\">" + c + "/" + t + "</span>" +
      "</div>";
    }).join("");

    const missed = S.items.filter(x => !isRight(x)).length;
    const flagged = S.items.filter(x => x.flagged).length;
    const filterBtn = (f, label, count) =>
      "<button class=\"btn\" data-act=\"filter\" data-f=\"" + f + "\" aria-pressed=\"" + (reviewFilter === f ? "true" : "false") + "\">" + label + " <span class=\"mono\">" + count + "</span></button>";

    const navCells = S.items.map((x, i) => {
      const c = ["cell", isRight(x) ? "right" : "wrong"];
      if (x.flagged) c.push("flagged");
      return "<li><button class=\"" + c.join(" ") + "\" data-act=\"jump\" data-i=\"" + i + "\" aria-label=\"Question " + (i + 1) + ", " + (isRight(x) ? "correct" : "missed") + "\">" + (i + 1) + "</button></li>";
    }).join("");

    const weakest = SEC_IDS.filter(s => r.bySec[s][1] > 0).sort((a, b) => r.bySec[a][0] / r.bySec[a][1] - r.bySec[b][0] / r.bySec[b][1])[0];

    return (
      "<section class=\"result-hero\" aria-labelledby=\"score-h\">" +
        "<p class=\"eyebrow\">" + (exam ? "Full exam" : "Practice") + " · " + esc(dateLabel(S.done)) + (exam ? " · " + Math.max(1, Math.round(used / 60000)) + " of " + EXAM.minutes + " min used" : "") + "</p>" +
        "<h1 class=\"score\" id=\"score-h\">" + r.correct + "<small>/ " + n + "</small></h1>" +
        "<p class=\"verdict " + (passed ? "pass" : "fail") + "\">" + verdict + "</p>" +
        (S.auto ? "<p class=\"muted\">Time ran out, so the exam was submitted automatically.</p>" : "") +
        "<div class=\"strip-wrap\"><div class=\"strip" + (passed ? "" : " fail") + "\" style=\"--n:" + n + ";--g:" + gap + "\" role=\"img\" aria-label=\"" + r.correct + " of " + n + " correct; pass mark " + pm + "\">" + cells +
          "<span class=\"passline\" style=\"left:calc(" + (pm / n * 100) + "% - 1px)\"><span>Pass " + pm + "</span></span></div></div>" +
        "<div class=\"row\">" +
          "<button class=\"btn btn-primary\" data-act=\"start-exam\">New full exam</button>" +
          (weakest ? "<button class=\"btn\" data-act=\"practice-weak\" data-s=\"" + weakest + "\">Practice " + esc(SECTIONS[weakest].name) + "</button>" : "") +
          "<button class=\"btn btn-quiet\" data-act=\"home\">Start page</button>" +
        "</div>" +
      "</section>" +
      "<section class=\"block\" aria-labelledby=\"sec-h\">" +
        "<div class=\"block-head\"><h2 id=\"sec-h\">By section</h2><p>The line marks " + Math.round(PASS_RATIO * 100) + "%, the overall pass rate. The exam is scored on your total, so your weakest sections are where you'll gain the most.</p></div>" +
        "<div class=\"secs\">" + secRows + "</div>" +
      "</section>" +
      "<section class=\"block\" aria-labelledby=\"rv-h\">" +
        "<div class=\"block-head\"><h2 id=\"rv-h\">Review answers</h2></div>" +
        "<ol class=\"grid\" aria-label=\"Jump to a question\">" + navCells + "</ol>" +
        "<div class=\"filters\" role=\"group\" aria-label=\"Filter questions\">" +
          filterBtn("all", "All", n) + filterBtn("missed", "Missed", missed) + filterBtn("flagged", "Flagged", flagged) +
        "</div>" +
        "<div class=\"rv-list\">" + S.items.map(reviewCard).join("") + "</div>" +
        "<p class=\"empty\" id=\"rv-empty\" hidden>No questions match this filter.</p>" +
      "</section>"
    );
  }

  function reviewCard(it, i) {
    const q = byId[it.id], right = isRight(it), skipped = !it.picked.length;
    const status = skipped ? "<span class=\"chip skip\">Unanswered</span>" : right ? "<span class=\"chip ok\">Correct</span>" : "<span class=\"chip bad\">Incorrect</span>";
    const opts = it.order.map((oi, k) => {
      const isAns = q.a.includes(oi), isPick = it.picked.includes(oi);
      const cls = isAns ? "right" : isPick ? "wrong" : "";
      const note = isAns && isPick ? "Your answer · correct" : isAns ? "Correct answer" : isPick ? "Your answer" : "";
      return "<li class=\"ropt " + cls + "\"><span class=\"opt-key\" aria-hidden=\"true\">" + KEYS[k] + "</span>" +
        "<span class=\"opt-text\">" + md(q.opts[oi]) + "</span>" + (note ? "<span class=\"opt-mark\">" + note + "</span>" : "") + "</li>";
    }).join("");
    return "<article class=\"rv\" id=\"rv-" + i + "\" data-ok=\"" + (right ? 1 : 0) + "\" data-flag=\"" + (it.flagged ? 1 : 0) + "\">" +
      "<header class=\"rv-head\"><p class=\"eyebrow\">Question " + (i + 1) + " · " + q.o + " " + esc(OBJECTIVES[q.o]) + "</p>" +
      "<div class=\"row\">" + (it.flagged ? "<span class=\"chip flag\">Flagged</span>" : "") + status + "</div></header>" +
      "<p class=\"qtext sm\">" + md(q.q) + "</p>" + codeHTML(q) +
      (q.a.length > 1 ? "<p class=\"hint multi\">" + hintText(q) + "</p>" : "") +
      "<ol class=\"ropts\">" + opts + "</ol>" + explainHTML(q) +
    "</article>";
  }

  function applyFilter() {
    let shown = 0;
    document.querySelectorAll(".rv").forEach(el => {
      const show = reviewFilter === "all" ||
        (reviewFilter === "missed" && el.dataset.ok === "0") ||
        (reviewFilter === "flagged" && el.dataset.flag === "1");
      el.hidden = !show;
      if (show) shown++;
    });
    document.querySelectorAll("[data-act=\"filter\"]").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === reviewFilter ? "true" : "false"));
    const empty = document.getElementById("rv-empty");
    if (empty) empty.hidden = shown > 0;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    if (e.target.closest("[data-stop]") && !e.target.closest("[data-act]")) return;
    const b = e.target.closest("[data-act]");
    if (!b) return;
    if (b.classList.contains("overlay") && e.target !== b) return;
    const act = b.dataset.act;

    switch (act) {
      case "home": confirmOpen = false; go("home"); break;
      case "resume": go("run"); break;
      case "results": go("results"); break;
      case "start-exam": startExam(); break;
      case "start-practice": {
        const secs = SEC_IDS.filter(s => { const c = document.getElementById("ps-" + s); return c && c.checked; });
        const count = (document.getElementById("pcount") || {}).value || "20";
        const err = document.getElementById("perr");
        if (!secs.length) { if (err) err.hidden = false; return; }
        store.set(PKEY, { secs, count });
        startPractice(secs, count);
        break;
      }
      case "practice-weak": startPractice([Number(b.dataset.s)], "20"); break;
      case "discard":
        if (b.dataset.armed) { S = null; clearInterval(tick); save(); render(); }
        else { b.dataset.armed = "1"; b.textContent = "Select again to discard"; }
        break;
      case "prev": move(-1); break;
      case "next": move(1); break;
      case "goto": S.cur = Number(b.dataset.i); save(); render({ moved: true }); break;
      case "flag": { const it = S.items[S.cur]; it.flagged = !it.flagged; save(); render(); const f = $app.querySelector(".btn-flag"); if (f) f.focus(); break; }
      case "check": S.items[S.cur].checked = true; save(); render(); { const fb = $app.querySelector(".feedback"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); } break;
      case "submit": confirmOpen = true; render(); break;
      case "cancel-submit": confirmOpen = false; render(); break;
      case "confirm-submit": finish(false); break;
      case "filter": reviewFilter = b.dataset.f; applyFilter(); break;
      case "jump": {
        const el = document.getElementById("rv-" + b.dataset.i);
        if (el && el.hidden) { reviewFilter = "all"; applyFilter(); }
        if (el) el.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
        break;
      }
    }
  });

  document.addEventListener("change", e => {
    if (e.target.matches && e.target.matches("input[name=\"opt\"]") && view === "run") pick(Number(e.target.value), false);
  });

  document.addEventListener("keydown", e => {
    if (view !== "run" || !S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
    if (confirmOpen) { if (e.key === "Escape") { confirmOpen = false; render(); } return; }
    const t = e.target;
    if (t && (t.tagName === "SELECT" || t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && !/^(radio|checkbox)$/.test(t.type)))) return;
    const k = (e.key || "").toLowerCase();
    const it = S.items[S.cur], q = byId[it.id];
    const idx = k.length === 1 ? "abcde".indexOf(k) : -1;
    if (idx >= 0 && idx < q.opts.length) { e.preventDefault(); pick(it.order[idx], true); return; }
    if (k === "n") { e.preventDefault(); move(1); }
    else if (k === "p") { e.preventDefault(); move(-1); }
    else if (k === "f") { e.preventDefault(); it.flagged = !it.flagged; save(); render(); }
  });

  /* ---------- boot ---------- */
  if (S && !validSession(S)) { S = null; save(); }
  if (S && !S.done && S.mode === "exam" && Date.now() >= S.deadline) {
    finish(true);
  } else {
    if (S && !S.done) view = "run";
    render();
    startTick();
  }
})();
</script>
</body>
</html>
