<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unofficial timed practice exam for the Adobe Experience Manager Business Practitioner Professional certification (AD0-E138), with section scores and explained answers.">
<title>AEM Business Practitioner Mock Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: a proctored exam console. Sticky status bar with timer, a reading column for the
   question, and a question navigator rail on the right that drops below the question on phones. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunken: #e9edf3;
  --ink: #161a22;
  --muted: #586174;
  --line: #d6dce6;
  --accent: #2447c4;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fb;
  --ok: #13744a;
  --ok-soft: #e1f2e9;
  --bad: #b3302a;
  --bad-soft: #fae6e4;
  --flag: #946000;
  --flag-soft: #f9eed6;
  --code-bg: #eef1f6;
  --scrim: rgb(10 14 22 / .5);
  --font-display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Source Code Pro", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --sunken: #1d222c; --ink: #e7eaf0; --muted: #98a1b3; --line: #2a303c;
    --accent: #8ea3ff; --accent-ink: #0e1117; --accent-soft: #1e2744;
    --ok: #5cc890; --ok-soft: #14271d; --bad: #ff8a7e; --bad-soft: #2e1918; --flag: #f0b54a; --flag-soft: #2b2312;
    --code-bg: #11151c; --scrim: rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --sunken: #1d222c; --ink: #e7eaf0; --muted: #98a1b3; --line: #2a303c;
  --accent: #8ea3ff; --accent-ink: #0e1117; --accent-soft: #1e2744;
  --ok: #5cc890; --ok-soft: #14271d; --bad: #ff8a7e; --bad-soft: #2e1918; --flag: #f0b54a; --flag-soft: #2b2312;
  --code-bg: #11151c; --scrim: rgb(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: .18em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code {
  font-family: var(--font-mono); font-size: .86em;
  background: var(--code-bg); border: 1px solid var(--line);
  padding: .02em .32em; border-radius: 4px; overflow-wrap: anywhere;
}

/* ---------- Status bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 74rem; margin: 0 auto; padding: .65rem max(16px, 3vw);
  display: flex; align-items: center; gap: 1rem; min-height: 3.25rem;
}
.brand {
  font: 600 .85rem var(--font-mono); letter-spacing: .03em; color: var(--ink);
  background: none; border: 0; padding: .25rem 0; cursor: pointer; white-space: nowrap;
}
.brand b { color: var(--accent); font-weight: 600; }
.bar-note { font: 500 .78rem var(--font-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.bar-spacer { flex: 1; }
.progress { flex: 1; height: 5px; background: var(--sunken); border-radius: 3px; overflow: hidden; min-width: 3rem; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.timer { font: 600 1.05rem var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.timer.warn { color: var(--bad); }

/* ---------- Page frame ---------- */
.wrap { max-width: 74rem; margin: 0 auto; padding-inline: max(16px, 3vw); padding-block: 2rem 4rem; }
.eyebrow {
  font: 500 .76rem/1.4 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
h1, h2, h3 { text-wrap: balance; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }

/* ---------- Buttons ---------- */
.btn {
  font: 600 .95rem/1.2 var(--font-body); padding: .65rem 1.1rem; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; gap: .45rem;
}
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-flag[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: .5rem; }
.btn-quiet:hover { color: var(--ink); border-color: transparent; }

/* ---------- Home ---------- */
.intro { display: grid; gap: 1rem; max-width: 50rem; }
.intro h1 { font: 600 clamp(2.1rem, 5.2vw, 3.25rem)/1.08 var(--font-display); letter-spacing: -.015em; margin: 0; }
.lede { margin: 0; color: var(--muted); font-size: 1.12rem; max-width: 42rem; }
.facts { display: flex; flex-wrap: wrap; gap: 1.25rem 2.75rem; margin: .75rem 0 0; }
.facts > div { display: flex; flex-direction: column-reverse; }
.facts dt { font: 500 .74rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font: 600 2rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }

.banner {
  margin-top: 2rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; justify-content: space-between;
}
.banner p { margin: 0; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 21rem), 1fr)); gap: 1rem; margin-top: 2rem; }
.mode {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0;
}
.mode h2 { font: 600 1.45rem/1.2 var(--font-display); margin: 0; }
.mode p { margin: 0; color: var(--muted); }
.mode .btn { align-self: flex-start; margin-top: auto; }
.mode-primary { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.picks { border: 0; padding: 0; margin: 0; display: grid; gap: .35rem; }
.picks legend { font: 500 .74rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; padding: 0; }
.check {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; align-items: center;
  padding: .35rem .5rem; border-radius: 6px; cursor: pointer;
}
.check:hover { background: var(--sunken); }
.check input { accent-color: var(--accent); width: 1rem; height: 1rem; margin: 0; }
.field { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.field span { font: 500 .74rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
select {
  font: 500 .95rem var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: .45rem .6rem;
}
.err { color: var(--bad); margin: 0; font-weight: 600; font-size: .95rem; }

.block { margin-top: 3.5rem; display: grid; gap: 1rem; }
.block-head { display: grid; gap: .35rem; }
.block h2 { font: 600 1.6rem/1.2 var(--font-display); margin: 0; }
.block-head p { margin: 0; color: var(--muted); max-width: 46rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 40rem; font-size: .96rem; }
th, td { text-align: left; padding: .85rem 1rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 500 .72rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec-name { font-weight: 700; }
.objs { list-style: none; margin: .35rem 0 0; padding: 0; color: var(--muted); font-size: .9rem; display: grid; gap: .15rem; }
.objs .mono { color: var(--ink); margin-right: .4rem; font-size: .82rem; }
.wbar { display: block; width: 6rem; height: 6px; border-radius: 3px; background: var(--sunken); margin-top: .45rem; overflow: hidden; }
.wbar > span { display: block; height: 100%; background: var(--accent); }
.note { font-size: .92rem; color: var(--muted); margin: 0; }

.hist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.hist li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1rem; align-items: center;
  padding: .75rem 1rem; border-bottom: 1px solid var(--line);
}
.hist li:last-child { border-bottom: 0; }
.hist .when { color: var(--muted); font-size: .92rem; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 1.25rem; color: var(--muted); margin: 0; }

.foot { margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; display: grid; gap: .5rem; max-width: 52rem; }
.foot p { margin: 0; }

/* ---------- Chips ---------- */
.chip {
  font: 600 .7rem/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase;
  padding: .32rem .55rem; border-radius: 99px; white-space: nowrap; display: inline-block;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.skip { background: var(--sunken); color: var(--muted); }
.chip.flag { background: var(--flag-soft); color: var(--flag); }

/* ---------- Exam console ---------- */
.run { display: grid; grid-template-columns: minmax(0, 1fr) 17.5rem; gap: 2.5rem; align-items: start; }
.qpane { min-width: 0; display: grid; gap: 1.1rem; max-width: 48rem; }
.qtext { font: 500 1.4rem/1.45 var(--font-display); margin: 0; letter-spacing: -.005em; }
.qtext:focus { outline: none; }
.qtext.sm { font-size: 1.12rem; }
.hint { margin: 0; font-weight: 600; color: var(--muted); font-size: .95rem; }
.hint.multi { color: var(--accent); }
.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.code-lang { display: block; font: 500 .68rem var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: .6rem 1rem 0; }
.code code { display: block; background: none; border: 0; padding: .45rem 1rem .85rem; font-size: .86rem; line-height: 1.6; white-space: pre; overflow-wrap: normal; }

.opts { border: 0; margin: 0; padding: 0; display: grid; gap: .6rem; min-width: 0; }
.opt {
  display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .8rem; align-items: start;
  padding: .85rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  cursor: pointer; transition: border-color .12s ease, background-color .12s ease;
}
.opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt-key {
  font: 600 .78rem/1.6rem var(--font-mono); text-align: center; color: var(--muted);
  border: 1px solid var(--line); height: 1.6rem; border-radius: 5px; background: var(--bg);
}
.multi-set .opt-key { border-radius: 5px; }
.single-set .opt-key { border-radius: 50%; }
.opt-text { padding-top: .1rem; min-width: 0; }
.opt-mark { font: 600 .7rem/1.6rem var(--font-mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.picked .opt-key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt-key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.right .opt-mark { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.wrong .opt-mark { color: var(--bad); }
.opt.locked { cursor: default; }

.feedback { display: grid; gap: .6rem; }
.verdict-line { margin: 0; font-weight: 700; }
.verdict-line.ok { color: var(--ok); }
.verdict-line.bad { color: var(--bad); }
.explain { background: var(--sunken); border-radius: 10px; padding: 1rem 1.15rem; display: grid; gap: .5rem; }
.explain p { margin: 0; }
.explain .label { font: 600 .7rem var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.explain .ref { font-size: .93rem; }

.qactions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: space-between; align-items: center; padding-top: .4rem; }
.keys { margin: 0; font: 400 .78rem var(--font-mono); color: var(--muted); }

.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 4.5rem);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 1.1rem; display: grid; gap: 1rem; min-width: 0;
}
.rail-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.rail h2 { font: 600 .74rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(2.15rem, 1fr)); gap: .3rem; }
.cell {
  width: 100%; aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  font: 500 .76rem var(--font-mono); color: var(--muted); cursor: pointer; position: relative; padding: 0;
}
.cell:hover { border-color: var(--muted); }
.cell.answered { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.cell.right { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.cell.wrong { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.cell.current { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--ink); }
.cell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .35rem .9rem; font-size: .82rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: .35rem; }
.sw { width: .8rem; height: .8rem; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); position: relative; }
.sw.answered { background: var(--accent-soft); border-color: transparent; }
.sw.flagged::after { content: ""; position: absolute; inset: 0; margin: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--flag); }
.sw.right { background: var(--ok-soft); border-color: transparent; }
.sw.wrong { background: var(--bad-soft); border-color: transparent; }
.rail .btn { justify-content: center; }

/* ---------- Dialog ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  max-width: 30rem; width: 100%; padding: 1.5rem; display: grid; gap: 1rem;
  box-shadow: 0 24px 60px rgb(0 0 0 / .25);
}
.dialog h2 { font: 600 1.4rem/1.2 var(--font-display); margin: 0; }
.dialog p { margin: 0; color: var(--muted); }
.dialog .row { justify-content: flex-end; }

/* ---------- Results ---------- */
.result-hero { display: grid; gap: .5rem; }
.score { font: 600 clamp(3.5rem, 11vw, 5.5rem)/1 var(--font-display); margin: .3rem 0 0; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score small { font-size: .38em; color: var(--muted); letter-spacing: 0; margin-left: .15em; }
.verdict { margin: 0; font-size: 1.15rem; font-weight: 700; }
.verdict.pass { color: var(--ok); }
.verdict.fail { color: var(--bad); }
.strip-wrap { padding: 1.5rem 0 2rem; }
.strip { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--g, 3px); }
.strip i { height: 1.75rem; background: var(--sunken); border-radius: 2px; }
.strip i.on { background: var(--ok); }
.strip.fail i.on { background: var(--accent); }
.passline { position: absolute; top: -.45rem; bottom: -.45rem; width: 2px; background: var(--ink); }
.passline span {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: .3rem;
  font: 600 .7rem var(--font-mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.secs { display: grid; gap: .9rem; }
.sec-row { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr) 4.5rem; gap: 1rem; align-items: center; }
.sec-row .label { font-weight: 600; }
.sec-row .label small { display: block; font: 400 .8rem var(--font-mono); color: var(--muted); }
.sec-row .val { font: 600 .95rem var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar2 { position: relative; height: .7rem; background: var(--sunken); border-radius: 99px; }
.bar2 > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar2 > span.ok { background: var(--ok); }
.bar2 .tick { position: absolute; top: -.3rem; bottom: -.3rem; width: 2px; background: var(--ink); opacity: .55; }
.filters { display: flex; flex-wrap: wrap; gap: .4rem; }
.filters .btn { padding: .45rem .8rem; font-size: .88rem; }
.filters .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rv-list { display: grid; gap: 1rem; }
.rv {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 1.25rem; display: grid; gap: .85rem; scroll-margin-top: 5rem; min-width: 0;
}
.rv-head { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; }
.ropts { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.ropt {
  display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .7rem; align-items: start;
  padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 8px;
}
.ropt.right { border-color: var(--ok); background: var(--ok-soft); }
.ropt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ropt .opt-key { border-radius: 5px; }
.ropt.right .opt-key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ropt.wrong .opt-key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.ropt.right .opt-mark { color: var(--ok); }
.ropt.wrong .opt-mark { color: var(--bad); }

@media (max-width: 900px) {
  .run { grid-template-columns: minmax(0, 1fr); gap: 2rem; }
  .rail { position: static; }
}
@media (max-width: 600px) {
  .wrap { padding-block: 1.25rem 3rem; }
  .qtext { font-size: 1.22rem; }
  .sec-row { grid-template-columns: minmax(0, 1fr) auto; gap: .45rem .75rem; }
  .sec-row .bar2 { grid-column: 1 / -1; order: 3; }
  .hist li { grid-template-columns: minmax(0, 1fr) auto; }
  .hist li .chip { grid-column: 2; }
  .opt, .ropt { grid-template-columns: 1.6rem minmax(0, 1fr); }
  .opt-mark { grid-column: 2; line-height: 1.2; }
  .bar-note.hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="bar" id="bar"></header>
<main class="wrap" id="app"></main>

<script>
/* =====================================================================
   Question bank. Original questions written against the objectives in
   Adobe's AD0-E138 exam (AEM Business Practitioner Professional).
   o = objective, a = indexes of the correct options.
   ===================================================================== */
const SECTIONS = {
  1: { name: "Product Capabilities", weight: 28, draw: 14 },
  2: { name: "Content Authoring and Optimization", weight: 24, draw: 12 },
  3: { name: "Technical", weight: 16, draw: 8 },
  4: { name: "Content Delivery", weight: 22, draw: 11 },
  5: { name: "Business Analysis", weight: 10, draw: 5 }

{ id: "A17", o: "2.3",
  q: "The English site must also be available in French and German. Which approach fits?",
  opts: ["Create language copies and translate them through translation projects", "Create live copies and retype the text in each language", "Create a Launch for each language", "Use Smart Tags in French and German"],
  a: [0],
  ex: "Translation uses language copies managed by translation projects, with machine or human translation. MSM is for sites that share content in the same language. Large sites often combine both: language masters are translated, then rolled out to country live copies.",
  ref: ["Translating content for multilingual sites", DOC + "sites/administering/reusing-content/translation/overview"] },
{ id: "A18", o: "2.4",
  q: "Before a redesign, the team needs a spreadsheet of all pages with their title, template, last modified and last published dates. Which out-of-the-box feature helps?",
  opts: ["The CSV Report option in the Sites console", "Package Manager", "Timewarp", "The Live Copy Overview"],
  a: [0],
  ex: "From the Sites console you can create a CSV report of a page tree and choose which properties to include, such as title, template, modified and published dates. It's a quick starting point for a content inventory.",
  ref: ["Organizing pages in the Sites console", DOC + "sites/authoring/sites-console/organizing-pages"] },
{ id: "A19", o: "2.4",
  q: "During a content audit, an editor wants to retire an old image but first needs to know which pages use it. Where can they check?",
  opts: ["The References rail for the asset", "The Timeline rail for the asset", "The asset's metadata schema", "Layout mode"],
  a: [0],
  ex: "The References rail lists pages and other content that use the selected item, so you know the impact before you change or delete it.",
  ref: ["Basic handling of the authoring UI", DOC + "sites/authoring/basic-handling"] },
{ id: "A20", o: "2.4",
  q: "An audit must show who modified and published a page, and when. Where does AEM show this?",
  opts: ["The Timeline rail", "The References rail", "Page properties, Advanced tab", "The Emulator"],
  a: [0],
  ex: "The Timeline rail shows a page's activity: versions, publishing events, workflows, launches and comments, with dates and users.",
  ref: ["Basic handling of the authoring UI", DOC + "sites/authoring/basic-handling"] },
{ id: "A21", o: "2.4",
  q: "Legal asks for a list of assets whose usage rights have expired. Which AEM feature helps?",
  opts: ["The Expiration report in Assets reports", "The Timeline rail of the DAM root folder", "Smart Tags", "The Live Copy Overview"],
  a: [0],
  ex: "Assets reports include an Expiration report that lists expired assets, along with reports on uploads, downloads, modifications and publishing.",
  ref: ["Assets reports", DOC + "assets/admin/asset-reports"] },
{ id: "A22", o: "2.4",
  q: "When deciding which pages to keep, update or remove, which data best shows whether visitors actually use them?",
  opts: ["Page-level traffic and engagement data from Adobe Analytics", "The number of versions each page has", "The size of each page in the repository", "The number of components on each page"],
  a: [0],
  ex: "A content audit combines an inventory from AEM with performance data. Visits, engagement and conversions from Analytics show which content earns its place.",
  ref: ["Adobe Analytics documentation", "https://experienceleague.adobe.com/en/docs/analytics"] },
{ id: "A23", o: "2.4",
  q: "What should a content audit produce?",
  opts: ["An inventory of existing content with a decision for each item, such as keep, update, merge or remove, and an owner", "A new set of page templates", "A full backup of the repository", "A list of AEM users and their passwords"],
  a: [0],
  ex: "The audit's output is a plan: what exists, how it performs, who owns it and what happens to it. That plan then feeds migrations, redesigns and governance.",
  ref: ["Organizing pages in the Sites console", DOC + "sites/authoring/sites-console/organizing-pages"] },

/* ---------------- Section 3: Technical ---------------- */
{ id: "T01", o: "3.1",
  q: "On a site, authors should create and edit pages, while approvers should also be able to publish. What's the recommended setup?",
  opts: ["An Authors group with read, create and modify permissions on the site, an Approvers group that also has Replicate, and users added to the right group", "Give every user full permissions and train them on the rules", "One group for everyone, with permissions adjusted per user", "Add approvers to the administrators group"],
  a: [0],
  ex: "Permissions belong to role-based groups; users get roles through membership. Administrators can do far more than publish, so using that group for approvers breaks least privilege.",
  ref: ["User, group and access rights administration", "https://experienceleague.adobe.com/en/docs/experience-manager-65/content/security/user-group-ac-admin"] },
{ id: "T02", o: "3.1",
  q: "How are users given access to the author service of AEM as a Cloud Service?",
  opts: ["Through product profiles in the Adobe Admin Console, which sign users in with Adobe IMS", "By creating local users in CRXDE Lite", "Through an LDAP configuration on the author service", "By editing a users file on the server"],
  a: [0],
  ex: "Author access in Cloud Service goes through Adobe Identity Management. Administrators assign users to AEM product profiles in the Admin Console; AEM groups then control what those users can do.",
  ref: ["IMS support for AEM as a Cloud Service", DOC + "security/ims-support"] },
{ id: "T03", o: "3.1",
  q: "A group is given permissions on `/content/wknd/us`. Which pages do they apply to?",
  opts: ["`/content/wknd/us` and every page below it, unless different permissions are set lower in the tree", "Only `/content/wknd/us` itself", "Only the direct child pages of `/content/wknd/us`", "Every page under `/content/wknd`"],
  a: [0],
  ex: "Permissions are inherited down the content tree. That's one reason the site hierarchy matters: a well-structured tree lets you set permissions once per section.",
  ref: ["User, group and access rights administration", "https://experienceleague.adobe.com/en/docs/experience-manager-65/content/security/user-group-ac-admin"] },
{ id: "T04", o: "3.1",
  q: "Part of the website must only be visible to logged-in members. Which AEM feature restricts it on publish?",
  opts: ["A Closed User Group on that section", "Hide in Navigation", "Off Time", "Removing the Replicate permission"],
  a: [0],
  ex: "A Closed User Group, set in the page's permissions, limits who can see a page and its children on publish. Hiding a page from navigation doesn't protect it, and Replicate only affects who can publish.",
  ref: ["Closed User Groups", "https://experienceleague.adobe.com/en/docs/experience-manager-65/content/security/closed-user-groups"] },
{ id: "T05", o: "3.1",
  q: "A user needs to create and edit editable templates. Which group should they belong to?",
  opts: ["template-authors", "workflow-users", "dam-users", "everyone"],
  a: [0],
  ex: "Membership of template-authors gives access to the template editor. Template authoring is usually limited to a few trained people because template changes affect many pages.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "T06", o: "3.2",
  q: "WKND sells in the US (English), Canada (English and French) and Switzerland (German and French). Which structure follows Adobe's recommended pattern?",
  opts: ["Language masters such as `/content/wknd/language-masters/en`, `/fr` and `/de` as blueprints, with live copies such as `/content/wknd/us/en`, `/content/wknd/ca/fr` and `/content/wknd/ch/de`", "One page tree per country, each made by copying the US site", "All languages mixed under `/content/wknd`, with the language set per page", "A separate AEM installation for each country"],
  a: [0],
  ex: "Each language is translated once in the language masters. Country sites are live copies of the right master, so they inherit updates and can still make local changes.",
  ref: ["MSM best practices", DOC + "sites/administering/reusing-content/msm/best-practices"] },
{ id: "T07", o: "3.2",
  q: "How does AEM determine the language of a page for translation?",
  opts: ["From its language root, a page named with a language code such as `de` or `fr-ch`, or from the page's Language property", "From the visitor's browser settings", "From the host name of the website", "From the author's user profile"],
  a: [0],
  ex: "Language roots named with ISO language codes tell AEM which language a branch is in. The translation tools use them to create and update language copies.",
  ref: ["Preparing content for translation", DOC + "sites/administering/reusing-content/translation/preparation"] },
{ id: "T08", o: "3.2",
  q: "Product codes and prices must not be sent for translation, while titles and descriptions must. Where is this controlled?",
  opts: ["In the translation rules (Translation Configuration)", "In each page's Navigation Title", "In the dispatcher filters", "In the Style System"],
  a: [0],
  ex: "Translation rules define which properties and content are sent for translation, per path and component. That keeps translation costs down and protects values that must stay the same.",
  ref: ["Identifying content to translate", DOC + "sites/administering/reusing-content/translation/rules"] },
{ id: "T09", o: "3.2",
  q: "The French site must be translated by an external translation agency. What does AEM provide for this?",
  opts: ["Translation projects connected to the agency through a translation integration configuration", "Exporting the site as a package and emailing it", "A French rollout configuration in MSM", "Smart Tags in French"],
  a: [0],
  ex: "AEM's Translation Integration Framework connects to machine translation and to human translation vendors. Translation projects send content out, track jobs and bring translations back into the language copies.",
  ref: ["Translation Integration Framework", DOC + "sites/administering/reusing-content/translation/integration-framework"] },
{ id: "T10", o: "3.3", t: "multi",
  q: "Which are benefits of AEM as a Cloud Service compared with running AEM 6.5 on premise?",
  opts: ["No version upgrade projects, because Adobe updates the service continuously", "The publish tier scales automatically with traffic", "Customers can change product code under `/libs` freely", "Customers manage the servers and operating systems themselves"],
  a: [0, 1],
  ex: "Cloud Service is always current and scales automatically. Product code is read-only, and Adobe runs the infrastructure.",
  ref: ["What's new and different in AEM as a Cloud Service", DOC + "overview/what-is-new-and-different"] },
{ id: "T11", o: "3.3",
  q: "Which responsibility moves from the customer to Adobe with AEM as a Cloud Service?",
  opts: ["Running the infrastructure: patching, scaling, monitoring and backups", "Writing the project's components", "Creating content and templates", "Defining user groups and permissions"],
  a: [0],
  ex: "Adobe operates the service. Customers still own their code, their content and how access is organized.",
  ref: ["AEM as a Cloud Service introduction", DOC + "overview/introduction"] },
{ id: "T12", o: "3.3",
  q: "Which is the most valid reason for a company to keep AEM on its own servers rather than move to AEM as a Cloud Service?",
  opts: ["A regulation or internal policy requires the system to run on infrastructure the company controls", "It wants automatic product updates", "It wants a built-in CDN", "It needs publish to scale during traffic peaks"],
  a: [0],
  ex: "The other three options are things Cloud Service provides. Strict control over the hosting infrastructure is one of the few reasons to stay on premise.",
  ref: ["What's new and different in AEM as a Cloud Service", DOC + "overview/what-is-new-and-different"] },
{ id: "T13", o: "3.4",
  q: "How does AEM store content such as pages and their properties?",
  opts: ["As a tree of nodes and properties in a Java Content Repository (JCR), implemented by Apache Jackrabbit Oak", "As HTML files on the web server", "In relational database tables, one table per page", "Only in the dispatcher cache"],
  a: [0],
  ex: "Everything in AEM, from pages and assets to templates and configuration, is a node with properties in the JCR. That's why content has paths like `/content/wknd/us/en`.",
  ref: ["AEM development basics: the JCR", "https://experienceleague.adobe.com/en/docs/experience-manager-65/content/implementing/developing/introduction/the-basics"] },
{ id: "T14", o: "3.4",
  q: "Under which repository path are digital assets stored?",
  opts: ["`/content/dam`", "`/apps/dam`", "`/conf/assets`", "`/var/assets`"],
  a: [0],
  ex: "Assets live under `/content/dam`. Pages are under `/content/<site>`, configuration such as templates under `/conf`, and code under `/apps`.",
  ref: ["AEM development basics: the JCR", "https://experienceleague.adobe.com/en/docs/experience-manager-65/content/implementing/developing/introduction/the-basics"] },
{ id: "T15", o: "3.4",
  q: "Where in the repository are a site's editable templates stored?",
  opts: ["`/conf/<site>/settings/wcm/templates`", "`/apps/<site>/templates`", "`/content/<site>/templates`", "`/libs/wcm/templates`"],
  a: [0],
  ex: "Editable templates are configuration, so they live in `/conf`. Older static templates were code in `/apps`, and `/libs` holds Adobe's product code.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "T16", o: "3.4",
  q: "How are large files, such as videos and high-resolution images, stored?",
  opts: ["In a separate binary (blob) store, referenced from the asset's node in the repository", "As text inside a page property", "Only in the dispatcher cache", "Only on the CDN"],
  a: [0],
  ex: "The repository keeps the node structure and metadata, while binaries go to a data store or cloud blob storage. Renditions are stored as child nodes of the asset that point to their binaries.",
  ref: ["Apache Jackrabbit Oak", "https://jackrabbit.apache.org/oak/docs/"] },
{ id: "T17", o: "3.5",
  q: "What is the main purpose of Edge Delivery Services?",
  opts: ["Delivering very fast, high-performing websites from the edge, with simple authoring and a lightweight code base", "Storing original asset files instead of AEM Assets", "Running approval workflows on publish", "Translating content automatically"],
  a: [0],
  ex: "Edge Delivery Services serves pages from a CDN-based architecture designed for top Core Web Vitals scores. Developers write lightweight blocks, and authors use familiar tools.",
  ref: ["Edge Delivery Services overview", DOC + "edge-delivery/overview"] },
{ id: "T18", o: "3.5", t: "multi",
  q: "Which authoring approaches can be used with Edge Delivery Services?",
  opts: ["Document-based authoring in tools such as Microsoft Word or Google Docs", "WYSIWYG authoring in AEM with the Universal Editor", "Editing HTML files directly on the CDN", "Authoring in CRXDE Lite"],
  a: [0, 1],
  ex: "Authors can write in documents stored in SharePoint or Google Drive, or edit visually with the Universal Editor on AEM content. Both publish through Edge Delivery Services.",
  ref: ["WYSIWYG authoring with Edge Delivery Services", DOC + "edge-delivery/wysiwyg-authoring/authoring"] },
{ id: "T19", o: "3.5",
  q: "In document-based authoring for Edge Delivery Services, which tool do authors use to preview and publish a document?",
  opts: ["AEM Sidekick", "Package Manager", "The Emulator", "The Live Copy Overview"],
  a: [0],
  ex: "Sidekick is a browser extension. From the document or the page, authors preview changes, publish them and switch between environments.",
  ref: ["AEM Sidekick", "https://www.aem.live/docs/sidekick"] },
{ id: "T20", o: "3.5",
  q: "An Edge Delivery Services site has a page at `main--wknd--acme.aem.page` and the same page at `main--wknd--acme.aem.live`. What's the difference?",
  opts: ["`.aem.page` shows the previewed version; `.aem.live` shows the published version", "`.aem.page` is for desktop; `.aem.live` is for mobile", "`.aem.page` is the author service; `.aem.live` is the dispatcher", "There is no difference; both are aliases"],
  a: [0],
  ex: "Previewing a document updates the `.page` URL so authors can check it. Publishing updates the `.live` URL, which the production domain serves.",
  ref: ["Edge Delivery Services documentation", "https://www.aem.live/docs/"] },

/* ---------------- Section 4: Content Delivery ---------------- */
{ id: "D01", o: "4.1",
  q: "The same product information must appear on the website, in a mobile app and on in-store screens. What's the best practice?",
  opts: ["Create it once as Content Fragments and deliver it to each channel through APIs such as GraphQL", "Copy the text into separate pages for each channel", "Create an Experience Fragment per channel and retype the text", "Export a PDF for each channel"],
  a: [0],
  ex: "Structured, channel-neutral content is created once and delivered everywhere. Every channel shows the same approved information, and updates happen in one place.",
  ref: ["Headless introduction", DOC + "headless/introduction"] },
{ id: "D02", o: "4.1",
  q: "A promotion built in AEM with components and layout must be used in Adobe Target activities. How should it get there?",
  opts: ["Export the Experience Fragment to Adobe Target as an offer", "Copy the page HTML into Target by hand", "Publish the page and link to it from Target", "Create a Content Fragment and attach it in Target"],
  a: [0],
  ex: "Experience Fragments can be exported to Target, where they become offers for tests and personalization activities. Authors keep editing them in AEM.",
  ref: ["Experience Fragments", DOC + "sites/authoring/fragments/experience-fragments"] },
{ id: "D03", o: "4.1",
  q: "An external email tool needs the HTML of an AEM promotion without the site's header, footer and scripts. What can it use?",
  opts: ["The Experience Fragment's plain HTML rendition, requested with the `.plain.html` selector", "The page's `.model.json` output", "A screenshot of the page", "The Live Copy Overview"],
  a: [0],
  ex: "The plain HTML rendition returns just the fragment's markup, which third-party channels such as email can include.",
  ref: ["Experience Fragments", DOC + "sites/authoring/fragments/experience-fragments"] },
{ id: "D04", o: "4.1",
  q: "Product videos must play smoothly both on slow mobile networks and on fast desktop connections. Which feature helps?",
  opts: ["Dynamic Media video with adaptive streaming", "Uploading one large MP4 file", "Experience Fragment variations", "Smart Tags"],
  a: [0],
  ex: "Adaptive streaming encodes several bitrates, and the player switches between them according to the device and connection.",
  ref: ["Dynamic Media video", DOC + "assets/dynamicmedia/video"] },
{ id: "D05", o: "4.1",
  q: "What is the main benefit of headless delivery from AEM?",
  opts: ["One content source can serve any front end or channel, and front-end teams can use their own frameworks", "Authors no longer need to approve content", "It removes the need for a CDN", "Pages render faster in the page editor"],
  a: [0],
  ex: "Headless separates content from presentation. AEM manages and delivers content through APIs, and apps, sites and devices present it their own way.",
  ref: ["Headless introduction", DOC + "headless/introduction"] },
{ id: "D06", o: "4.1",
  q: "Which practice keeps content consistent across many touchpoints?",
  opts: ["Reference shared content, such as fragments and assets, instead of copying it into each channel", "Let each channel team keep its own copy of the content", "Store channel content in spreadsheets outside AEM", "Create a new page for every channel and device"],
  a: [0],
  ex: "When channels reference one source, an update reaches all of them and nothing drifts out of date. The References rail then shows where each item is used.",
  ref: ["Content Fragments overview", DOC + "sites/administering/content-fragments/overview"] },
{ id: "D07", o: "4.2",
  q: "A workflow's approval step must go to the Brand Approvers group. How is it set up, and what happens when it runs?",
  opts: ["A Participant Step with the group as the participant; the task appears in every member's Inbox and one of them completes it", "A Process Step with the group's name as an argument; every member must approve it separately", "A Participant Step assigned to each member one after another", "An email to the group, outside AEM"],
  a: [0],
  ex: "Assigning a participant step to a group puts the work item in each member's Inbox. Whoever acts first completes the step for the whole group.",
  ref: ["Participating in workflows", DOC + "sites/authoring/workflows/participating"] },
{ id: "D08", o: "4.2",
  q: "Where do approvers see the workflow tasks assigned to them?",
  opts: ["In the AEM Inbox", "In the Timeline rail of the DAM root", "In Package Manager", "In the page's Navigation Title"],
  a: [0],
  ex: "The Inbox collects notifications and tasks from workflows, including items assigned to groups the user belongs to.",
  ref: ["Your Inbox", DOC + "sites/authoring/inbox"] },
{ id: "D09", o: "4.2",
  q: "Approval must go to US approvers for US pages and UK approvers for UK pages, decided when the workflow runs. Which step type fits?",
  opts: ["A Dynamic Participant Step", "A Participant Step assigned to the administrators group", "A Process Step with no participant", "An OR Split that emails both teams"],
  a: [0],
  ex: "A Dynamic Participant Step chooses the user or group at runtime, for example from the page's path. A normal Participant Step is always assigned to the same user or group.",
  ref: ["Participating in workflows", DOC + "sites/authoring/workflows/participating"] },
{ id: "D10", o: "4.2",
  q: "Why should workflow steps be assigned to groups rather than to named users?",
  opts: ["When people join or leave, only group membership changes, not the workflow model, and the work is shared among members", "Workflows can't be assigned to individual users", "Group steps run faster", "Group steps skip approval"],
  a: [0],
  ex: "Group assignment keeps workflow models stable and avoids bottlenecks when one person is away.",
  ref: ["Applying workflows to pages", DOC + "sites/authoring/workflows/applying"] },
{ id: "D11", o: "4.2",
  q: "An author who doesn't have publish permission selects Publish on a page. What does AEM do?",
  opts: ["It starts a request for publication workflow, so someone with the permission can approve and publish the page", "It publishes the page anyway", "It deletes the author's changes", "It creates a Launch of the page"],
  a: [0],
  ex: "Without publish permission, the publish action starts a workflow that notifies the people who can publish. This is how approval is built into publishing.",
  ref: ["Publishing pages", DOC + "sites/authoring/sites-console/publishing-pages"] },
{ id: "D12", o: "4.3",
  q: "Which page editor feature lets authors check how a page looks at phone and tablet widths?",
  opts: ["The Emulator", "Timewarp", "Developer mode", "The Live Copy Overview"],
  a: [0],
  ex: "The Emulator in the page editor toolbar shows the page at the widths of different devices. In Layout mode you can then adjust components for each breakpoint.",
  ref: ["Responsive layout", DOC + "sites/authoring/page-editor/responsive-layout"] },
{ id: "D13", o: "4.3",
  q: "On desktop, three teasers sit side by side; on phones they should stack. Where do authors set this?",
  opts: ["In Layout mode, by resizing the components for each breakpoint", "In the Style System", "In page properties", "In the template's Initial Content"],
  a: [0],
  ex: "Layout mode lets authors resize and hide components per breakpoint in the layout container. Together with the Emulator, this covers responsive behavior without code changes.",
  ref: ["Responsive layout", DOC + "sites/authoring/page-editor/responsive-layout"] },
{ id: "D14", o: "4.3",
  q: "An author wants to click links and try interactive components as a visitor would, without leaving the editor. Which mode should they use?",
  opts: ["Preview mode", "Edit mode", "Layout mode", "Structure mode"],
  a: [0],
  ex: "Preview mode shows the page as visitors see it, with working links and components, inside the editor. You can switch back to Edit at any time.",
  ref: ["Page editor introduction", DOC + "sites/authoring/page-editor/introduction"] },
{ id: "D15", o: "4.4", t: "multi",
  q: "A new editable template doesn't appear in the Create Page wizard under the site's root. What's usually missing?",
  opts: ["The template hasn't been enabled", "The template isn't allowed for that part of the site (Allowed Templates)", "The template hasn't been published to the publish tier", "The template has no Initial Content"],
  a: [0, 1],
  ex: "A template must be enabled, and the page under which you create content must allow it through Allowed Templates. Publishing the template matters for publish, not for creating pages on author.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "D16", o: "4.4",
  q: "Authors must only be able to add Text, Image and Teaser to the main area of article pages. Where is this set?",
  opts: ["In the policy of the layout container, in the template's Structure mode", "In each article's page properties", "In the Style System", "In the dispatcher filters"],
  a: [0],
  ex: "Content policies on the template set the allowed components for each container. Every page created from the template follows them.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "D17", o: "4.4",
  q: "The header and footer must be identical on every page and authors must not edit them, while the main area stays editable. How is this done in the template?",
  opts: ["Keep the header and footer locked in Structure mode and unlock the main container", "Put the header and footer in Initial Content", "Hide the header and footer from navigation", "Add the header and footer to every page by hand"],
  a: [0],
  ex: "Components in the template's structure are locked by default and shared by all pages. Unlocking the main container lets authors add content there.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "D18", o: "4.4",
  q: "On article pages, the Image component must only offer certain widths and must not allow cropping. Where is this configured?",
  opts: ["In the Image component's policy on the template", "In each image's asset metadata", "In the Emulator", "In the page's Vanity URL"],
  a: [0],
  ex: "Component policies hold design settings such as allowed widths, cropping and heading levels. Authors work within those limits on every page that uses the template.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "D19", o: "4.4",
  q: "What is the difference between a template's Structure and its Initial Content?",
  opts: ["Structure is shared by all pages and changes apply to existing pages; Initial Content is copied into new pages, where authors can change it freely", "Structure is for desktop and Initial Content is for mobile", "Structure holds images and Initial Content holds text", "There is no difference; they are two names for the same mode"],
  a: [0],
  ex: "Structure stays linked to the template. Initial Content is only a starting point, so later changes to it only affect pages created afterwards.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },
{ id: "D20", o: "4.4",
  q: "A template author adds a newsletter sign-up component, locked, to the Structure of a template that already has 300 pages. What happens to those pages?",
  opts: ["They all show the new component, because pages stay linked to their template's structure", "Only pages created from now on get it", "The existing pages must be recreated", "The pages must be rolled out from a blueprint first"],
  a: [0],
  ex: "Editable templates are dynamic: structure changes reach existing pages. Changes to Initial Content don't.",
  ref: ["Creating page templates", DOC + "sites/authoring/sites-console/templates"] },

/* ---------------- Section 5: Business Analysis ---------------- */
{ id: "B01", o: "5.1",
  q: "Why does the page hierarchy matter so much in AEM?",
  opts: ["It shapes URLs, navigation and breadcrumbs, and sets the scope for permissions, MSM and translation", "It only affects how pages are listed in the Sites console", "It decides which fonts each page uses", "It has no effect once pages are published"],
  a: [0],
  ex: "Navigation and breadcrumb components read the tree, permissions are inherited down it, and MSM and translation work on branches of it. Changing it later means moving content, URLs and settings.",
  ref: ["Organizing pages in the Sites console", DOC + "sites/authoring/sites-console/organizing-pages"] },
{ id: "B02", o: "5.1",
  q: "Which principle should guide the structure of the website hierarchy?",
  opts: ["Organize pages around how visitors look for information, in clear sections that aren't deeper than they need to be", "Mirror the company's internal organization chart", "Put all pages directly under the home page", "Nest pages as deeply as possible to group details"],
  a: [0],
